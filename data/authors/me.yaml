bio: |
  Hi! I'm AnnAnn, a second-year Electrical and Computer Engineering student
  at The Chinese University of Hong Kong, Shenzhen (CUHK-Shenzhen), in the
  Computer Engineering stream.

  I'm interested in robotics and computer engineering, especially the
  intersection of hardware and software. I'm currently strengthening my
  technical foundation through coursework, programming, projects, and
  research experience while exploring which area of robotics fits me best.

  I'm particularly interested in gaining more hands-on robotics research
  experience at CUHK-Shenzhen.

